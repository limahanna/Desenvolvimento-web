<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portal do aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container-login">

    <section class="card-login">
        <div class="cabecalho-card">
        <div class="logo-icone">&#x1f393</div>
        <h2>Acessar portal</h2>
        <p>digite sua credenciais para entrar na sua conta</p>
    </div>
    <form id="form-login" action='/login' method="post">
        <div class="grupo-campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
            placeholder="aluno@ifpa.edu.br" required>
        </div> 

        <div class="grupo-campo">
            <label for="senha">senha</label>
            <input type="password" id="senha" name="senha"
            placeholder="*********" required>
        </div>
        
        <div class="opcoes-login">
            <label class="lembrar-senha">
                <input type="checkbox" name="lembrar-senha" id="lembrar-senha">
                <span> lembrar senha </span>
            </label>
            <a href="#" class="esqueceu-senha">esqueceu senha</a>
        </div>

        <button type="submit" class="btn-login" id="btn-login">entrar</button>
      </form>

      <div class="rodape-card">
        <p>ainda nao possui uma conta?
            <a href="#">cadastre-se aqui</a></p>

      </div>
      </section>
    </main>
    <script  src="script-js"></script>
</body>
</html>
